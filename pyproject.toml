[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-campus-assistant"
version = "0.2.0"
description = "Cost-aware AI student helpdesk: a router sends each question to fast RAG, the student's own record, or deep research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.8,<2",
    "langchain-aws>=1.10,<2",
    "langchain-text-splitters>=1.1,<2",
    "boto3>=1.44,<2",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.67,<2",
    "pandas>=3.1,<4",
    "altair>=6.3,<7",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "langgraph-cli[inmem]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, common bugs.
select = ["E", "F", "I", "B", "W"]
ignore = [
    "E501",  # long lines are allowed where they read better (HTML snippets, prompts)
]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages and app.py put the project root on sys.path before importing ui.*.
"app.py" = ["E402"]
"ui/*.py" = ["E402"]
"tests/*.py" = ["E402", "F811"]  # F811: pytest fixtures imported from another test module
